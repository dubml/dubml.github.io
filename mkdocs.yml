site_name: Dubbo Service Mesh
site_url: https://dubml.github.io/
use_directory_urls: true

repo_name: dubbo-kubernetes
repo_url: https://github.com/apache/dubbo-kubernetes

# Standalone custom theme (no MkDocs Material dependency).
# Templates live in theme/; structural CSS/JS in theme/assets/.
theme:
  name: null
  custom_dir: theme
  static_templates:
    - 404.html
  favicon: assets/static/dubbo.ico
  logo: assets/static/dubbo.svg

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

hooks:
  - hooks/i18n_search.py

plugins:
  - search:
      lang: [en, zh]
      separator: '[\s\u200b\u3000\-、。，．？！；：:/.()\[\]{}<>=_"'',]+|(?<=[a-z])(?=[A-Z])|(?<=[A-Za-z])(?=[0-9])|(?<=[0-9])(?=[A-Za-z])'
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: false
      reconfigure_search: false
      languages:
        - locale: zh
          name: 简体中文
          default: true
          build: true
          site_name: Dubbo Service Mesh
          nav_translations:
            Home: 首页
            Overview: 概述
            Basic Concepts: 基本概念
            Traffic Management: 流量管理
            Security: 安全
            Observability: 可观测性
            Extensibility: 可扩展性
            Scalability: 可伸缩性
            On-Demand Activation: 按需激活
            Virtual Machine Workloads: 虚拟机接入
            Installation: 安装
            Embedded Program: 嵌入程序
            Tasks: 任务
            Traffic Splitting: 流量转移
            Traffic Routing: 流量路由
            Mutual TLS: 双向 TLS
            Example: 示例
            Operations: 运维
            Release Notes: 公告栏
        - locale: en
          name: English
          build: true
          site_name: Dubbo Service Mesh
          nav_translations:
            概述: Overview
            基本概念: Basic Concepts
            流量管理: Traffic Management
            安全: Security
            可观测性: Observability
            可扩展性: Extensibility
            可伸缩性: Scalability
            按需激活: On-Demand Activation
            虚拟机接入: Virtual Machine Workloads
            安装: Installation
            任务: Tasks
            流量切分: Traffic Splitting
            流量转移: Traffic Splitting
            流量路由: Traffic Routing
            网关: Gateway
            双向 TLS: Mutual TLS
            示例: Example
            运维: Operations
            公告栏: Release Notes

extra_css:
  - assets/custom.css?v=20260930-system-fonts-r1

extra_javascript:
  - assets/custom.js?v=20260726-r2
  - https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js
  - assets/mermaid-init.js?v=20260930-system-fonts-r1

nav:
  - Home: index.md
  - 概述:
      - overview/index.md
      - 基本概念:
          - 流量管理: concepts/traffic-management.md
          - 安全: concepts/security.md
          - 可观测性: concepts/observability.md
          - 可扩展性: concepts/extensibility.md
          - 可伸缩性: concepts/scalability.md
  - 安装:
      - Helm: setup/install/helm.md
      - Dubboctl: setup/install/dubboctl.md
  - 任务:
      - 流量管理:
          - 流量路由: tasks/traffic/routing/routing.md
          - 流量转移: tasks/traffic/canary/canary.md
          - 请求超时: tasks/traffic/request-timeouts/request-timeouts.md
          - 请求重试: tasks/traffic/request-retries/request-retries.md
          - 故障注入: tasks/traffic/fault-injection/fault-injection.md
          - 断路器: tasks/traffic/circuit-breaking/circuit-breaking.md
          - 网关:
              - Ingress: tasks/traffic/ingress/gateway-api.md
              - Egress: tasks/traffic/egress/egress.md
      - 安全:
          - 认证: tasks/security/mtls.md
          - 授权: tasks/security/jwt.md
      - 可观测性:
          - 指标: tasks/observability/metrics/metrics.md
          - 访问日志: tasks/observability/logs/access-logs.md
      - 可扩展性:
          - 网格服务: tasks/extensibility/service-entry.md
          - 非网格服务: tasks/extensibility/virtual-machines.md
      - 可伸缩性:
          - 按需激活: tasks/scalability/activation.md
  - 示例: example/moviereview.md
  - 参考:
      - 应用程序标准指标: reference/application-standard-metrics.md
  - 运维: operation/index.md
  - 公告栏: release/index.md

